name: CI

on:
  push:
    branches:
      - main
      - girder-5
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tox
        run: pip install tox
      - name: Lint
        run: tox -e lint
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools_scm needs history and tags to compute a version
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Build web client
        working-directory: girder_volview_dicomrt/web_client
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tox
        run: pip install tox
      - name: Test that the plugin loads in Girder
        run: tox -e test
